[package]
name = "meander-example-diff-drive"
description = "Example: a minimal differential-drive robot model on meander-core"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bincode = { workspace = true }
cu29 = { workspace = true }
libm = { workspace = true }
meander-core = { path = "../../components/libs/meander_core", default-features = false }
serde = { workspace = true }

[dev-dependencies]
ron = "0.12"

[features]
default = ["std"]
std = ["cu29/std", "bincode/std", "serde/std", "meander-core/std"]
