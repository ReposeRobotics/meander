[package]
name = "meander-example-waypoint-mapping"
description = "Example: drive a diff-drive robot through waypoints, map a room with a simulated lidar, save the map"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cu29 = { workspace = true, features = ["std"] }
meander-core = { path = "../../components/libs/meander_core" }
meander-grid = { path = "../../components/libs/meander_grid" }
meander-mapping = { path = "../../components/libs/meander_mapping" }
meander-example-diff-drive = { path = "../diff_drive" }
png = "0.17"

[features]
# Desktop-only example: always std. The empty feature keeps `--no-default-features` workspace runs working.
default = ["std"]
std = []
