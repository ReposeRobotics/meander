[package]
name = "meander-costmap"
description = "Fixed-size Euclidean obstacle inflation for copper-rs navigation"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "lib"
domains = ["algorithm/navigation"]
environments = ["host", "embedded"]

[dependencies]
cu29 = { workspace = true }
libm = { workspace = true }
serde = { workspace = true }
meander-core = { version = "0.2.0", path = "../meander_core", default-features = false }
meander-grid = { version = "0.2.0", path = "../meander_grid", default-features = false }

[features]
default = ["std"]
std = ["cu29/std", "meander-core/std", "meander-grid/std", "serde/std"]

[dev-dependencies]
ron = "0.12"
