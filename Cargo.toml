[workspace]
members = [
  "components/libs/meander_core",
  "components/libs/meander_grid",
  "examples/diff_drive",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Lucas"]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
keywords = ["robotics", "navigation", "mapping", "copper", "real-time"]
categories = ["science::robotics"]
repository = "https://github.com/ReposeRobotics/meander"
# Pre-1.0: nothing is published to crates.io (see docs/versioning.md).
publish = false

# cargo-release: one shared version, one `vX.Y.Z` tag for the whole workspace.
[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
publish = false
push = false

[workspace.dependencies]
cu29 = { version = "1.3.1", default-features = false, features = ["units"] }
bincode = { package = "cu-bincode", version = "2.2.0", default-features = false, features = [
  "derive",
  "alloc",
] }
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "alloc",
] }
libm = "0.2"
