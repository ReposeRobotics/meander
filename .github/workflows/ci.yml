name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    # Draft PRs are work in progress; the gate runs when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run PR gate
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --features std -- --deny warnings
          cargo clippy --workspace --lib --no-default-features -- --deny warnings
          cargo nextest run --workspace --features std
          cargo nextest run --workspace --no-default-features
          cargo test --workspace --doc --features std

  semver-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the release tags as baseline
      # Breaks are allowed when CHANGELOG.md lists them under Unreleased (see justfile).
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks,just
      - name: Check SemVer against the latest release tag
        run: just semver-check
